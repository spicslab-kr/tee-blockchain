<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fff"/>

  <!-- Vendor -->
  <rect x="40" y="40" width="300" height="150" fill="#fff" stroke="#333"/>
  <text x="52" y="60" font-weight="bold">Vendor</text>
  <text x="52" y="76" fill="#666" font-size="11">tb-vendor</text>
  <rect x="52" y="90" width="276" height="86" fill="#fdebd0" stroke="#333"/>
  <text x="62" y="107" font-size="12">TEE</text>
  <rect x="62" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="122" y="144" text-anchor="middle">app image</text>
  <rect x="196" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="256" y="144" text-anchor="middle">tb-ra-responder</text>

  <!-- Auditor -->
  <rect x="560" y="40" width="300" height="150" fill="#fff" stroke="#333"/>
  <text x="572" y="60" font-weight="bold">Auditor</text>
  <text x="572" y="76" fill="#666" font-size="11">tb-auditor</text>
  <rect x="572" y="90" width="276" height="86" fill="#fdebd0" stroke="#333"/>
  <text x="582" y="107" font-size="12">TEE, own build of the same source</text>
  <rect x="582" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="642" y="144" text-anchor="middle">app image</text>
  <rect x="716" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="776" y="144" text-anchor="middle">tb-ra-responder</text>

  <!-- User -->
  <rect x="40" y="320" width="300" height="100" fill="#fff" stroke="#333"/>
  <text x="52" y="340" font-weight="bold">User</text>
  <text x="52" y="356" fill="#666" font-size="11">tb-user</text>
  <text x="52" y="384">knows the TEE address</text>
  <text x="52" y="402">and the contract address, nothing else</text>

  <!-- Registry -->
  <rect x="560" y="320" width="300" height="100" fill="#fff" stroke="#333"/>
  <text x="572" y="340" font-weight="bold">Registry contract</text>
  <text x="572" y="356" fill="#666" font-size="11">smart contract on an Ethereum-compatible chain</text>
  <rect x="572" y="366" width="276" height="44" fill="#f2f2f2" stroke="#333"/>
  <text x="710" y="383" text-anchor="middle" font-size="11">platform · arch · service · version</text>
  <text x="710" y="400" text-anchor="middle" font-size="11">measurement · expiry · approver signature</text>

  <!-- Vendor -> Auditor -->
  <line x1="340" y1="100" x2="558" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450" y="92" text-anchor="middle" font-size="11" fill="#333">source + build environment</text>
  <text x="450" y="116" text-anchor="middle" font-size="11" fill="#666">or the built image + its measurement</text>

  <!-- Auditor -> Registry -->
  <line x1="710" y1="190" x2="710" y2="318" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="720" y="250" font-size="11" fill="#333">register</text>
  <text x="720" y="264" font-size="11" fill="#666">signed with the approver key</text>

  <!-- User <-> Vendor enclave -->
  <line x1="150" y1="318" x2="150" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="190" y1="192" x2="190" y2="318" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="140" y="250" text-anchor="end" font-size="11" fill="#333">nonce</text>
  <text x="200" y="244" font-size="11" fill="#333">attestation document</text>
  <text x="200" y="258" font-size="11" fill="#666">signed by the TEE hardware</text>
  <text x="200" y="272" font-size="11" fill="#666">carries the measurement</text>

  <!-- User -> Registry -->
  <line x1="340" y1="370" x2="558" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#333">lookup by measurement</text>
  <text x="450" y="386" text-anchor="middle" font-size="11" fill="#666">compare value, expiry, signer</text>

  <!-- flow 2 -->
  <path d="M 330 190 L 330 300 L 600 300 L 600 318" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="340" y="294" font-size="11" fill="#666">flow 2: self-register, own registry (no Auditor)</text>

  <!-- footnote -->
  <text x="40" y="446" font-size="11" fill="#666">Same source + same responder ⇒ same measurement on both sides. The User trusts the TEE only if a registration for exactly that measurement exists and checks out.</text>
  <text x="40" y="462" font-size="11" fill="#666">Platform today: AWS Nitro Enclaves, where the measurement is PCR0·1·2. The record carries the platform so other TEEs can register beside it.</text>
</svg>
