<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family='"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif' font-size="13" fill="#000">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fff"/>

  <!-- Vendor -->
  <rect x="40" y="40" width="300" height="150" fill="#fff" stroke="#333"/>
  <text x="52" y="60" font-weight="bold">서비스 제공자 (Vendor)</text>
  <text x="52" y="76" fill="#666" font-size="11">tb-vendor</text>
  <rect x="52" y="90" width="276" height="86" fill="#fdebd0" stroke="#333"/>
  <text x="62" y="107" font-size="12">TEE</text>
  <rect x="62" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="122" y="144" text-anchor="middle">앱 이미지</text>
  <rect x="196" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="256" y="144" text-anchor="middle">tb-ra-responder</text>

  <!-- Auditor -->
  <rect x="560" y="40" width="300" height="150" fill="#fff" stroke="#333"/>
  <text x="572" y="60" font-weight="bold">감사자 (Auditor)</text>
  <text x="572" y="76" fill="#666" font-size="11">tb-auditor</text>
  <rect x="572" y="90" width="276" height="86" fill="#fdebd0" stroke="#333"/>
  <text x="582" y="107" font-size="12">TEE, 같은 소스를 직접 빌드</text>
  <rect x="582" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="642" y="144" text-anchor="middle">앱 이미지</text>
  <rect x="716" y="118" width="120" height="44" fill="#fff" stroke="#333"/>
  <text x="776" y="144" text-anchor="middle">tb-ra-responder</text>

  <!-- User -->
  <rect x="40" y="320" width="300" height="100" fill="#fff" stroke="#333"/>
  <text x="52" y="340" font-weight="bold">사용자 (User)</text>
  <text x="52" y="356" fill="#666" font-size="11">tb-user</text>
  <text x="52" y="384">TEE 주소와 컨트랙트 주소만 안다</text>
  <text x="52" y="402">키도 ETH도 TEE 하드웨어도 없다</text>

  <!-- Registry -->
  <rect x="560" y="320" width="300" height="100" fill="#fff" stroke="#333"/>
  <text x="572" y="340" font-weight="bold">레지스트리 컨트랙트</text>
  <text x="572" y="356" fill="#666" font-size="11">이더리움 호환 체인의 스마트 컨트랙트</text>
  <rect x="572" y="366" width="276" height="44" fill="#f2f2f2" stroke="#333"/>
  <text x="710" y="383" text-anchor="middle" font-size="11">플랫폼 · 아키텍처 · 서비스 · 버전</text>
  <text x="710" y="400" text-anchor="middle" font-size="11">측정값 · 만료 · 승인자 서명</text>

  <!-- Vendor -> Auditor -->
  <line x1="340" y1="100" x2="558" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450" y="92" text-anchor="middle" font-size="11" fill="#333">소스 + 빌드 환경</text>
  <text x="450" y="116" text-anchor="middle" font-size="11" fill="#666">또는 빌드된 이미지 + 측정값</text>

  <!-- Auditor -> Registry -->
  <line x1="710" y1="190" x2="710" y2="318" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="720" y="250" font-size="11" fill="#333">등록</text>
  <text x="720" y="264" font-size="11" fill="#666">승인자 키로 서명한 기록</text>

  <!-- User <-> Vendor enclave -->
  <line x1="150" y1="318" x2="150" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="190" y1="192" x2="190" y2="318" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="140" y="250" text-anchor="end" font-size="11" fill="#333">난수</text>
  <text x="200" y="244" font-size="11" fill="#333">증명 문서</text>
  <text x="200" y="258" font-size="11" fill="#666">TEE 하드웨어가 서명</text>
  <text x="200" y="272" font-size="11" fill="#666">측정값 포함</text>

  <!-- User -> Registry -->
  <line x1="340" y1="370" x2="558" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#333">측정값으로 조회</text>
  <text x="450" y="386" text-anchor="middle" font-size="11" fill="#666">값 · 만료 · 서명자 대조</text>

  <!-- flow 2 -->
  <path d="M 330 190 L 330 300 L 600 300 L 600 318" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="340" y="294" font-size="11" fill="#666">흐름 2: 감사자 없이 자기 레지스트리에 직접 등록</text>

  <!-- footnote -->
  <text x="40" y="446" font-size="11" fill="#666">같은 소스 + 같은 응답기 ⇒ 양쪽에서 같은 측정값. 사용자는 바로 그 측정값의 등록이 있고 값·만료·서명자가 맞을 때만 TEE를 믿는다.</text>
  <text x="40" y="462" font-size="11" fill="#666">현재 플랫폼은 AWS Nitro Enclaves이고 측정값은 PCR0·1·2다. 등록에 플랫폼이 적혀 있어 다른 TEE도 나란히 등록할 수 있다.</text>
</svg>
