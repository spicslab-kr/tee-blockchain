<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family='"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif' font-size="13" fill="#000">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="230" fill="#fff"/>

  <text x="40" y="34" font-weight="bold">att-user verify</text>
  <text x="150" y="34" fill="#666" font-size="11">아래 네 단계를 한 번에 수행한다. 각 단계는 따로 명령으로도 있다</text>

  <!-- enclave (source) -->
  <rect x="40" y="70" width="100" height="60" fill="#fdebd0" stroke="#333"/>
  <text x="90" y="96" text-anchor="middle">제공자의</text>
  <text x="90" y="112" text-anchor="middle">TEE</text>

  <!-- step boxes -->
  <rect x="200" y="70" width="130" height="60" fill="#fff" stroke="#333"/>
  <text x="265" y="105" text-anchor="middle" font-weight="bold">ra-request</text>

  <rect x="380" y="70" width="130" height="60" fill="#fff" stroke="#333"/>
  <text x="445" y="105" text-anchor="middle" font-weight="bold">ra-parse</text>

  <rect x="560" y="70" width="130" height="60" fill="#fff" stroke="#333"/>
  <text x="625" y="105" text-anchor="middle" font-weight="bold">lookup</text>

  <rect x="740" y="70" width="130" height="60" fill="#fff" stroke="#333"/>
  <text x="805" y="105" text-anchor="middle" font-weight="bold">compare</text>

  <!-- arrows between steps -->
  <line x1="140" y1="90" x2="198" y2="90" stroke="#333" stroke-width="1.5" marker-start="url(#ar)"/>
  <text x="169" y="84" text-anchor="middle" font-size="11" fill="#333">난수</text>
  <line x1="140" y1="112" x2="198" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="169" y="126" text-anchor="middle" font-size="11" fill="#333">증명 문서</text>

  <line x1="330" y1="100" x2="378" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="354" y="92" text-anchor="middle" font-size="11" fill="#333">증명 문서</text>

  <line x1="510" y1="100" x2="558" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="534" y="92" text-anchor="middle" font-size="11" fill="#333">측정값</text>

  <line x1="690" y1="100" x2="738" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="714" y="92" text-anchor="middle" font-size="11" fill="#333">등록 키</text>

  <!-- registry under lookup -->
  <rect x="575" y="170" width="100" height="36" fill="#f2f2f2" stroke="#333"/>
  <text x="625" y="193" text-anchor="middle" font-size="12">레지스트리</text>
  <line x1="625" y1="130" x2="625" y2="168" stroke="#333" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <!-- what each step checks -->
  <text x="445" y="152" text-anchor="middle" font-size="11" fill="#666">TEE 루트 인증서까지 서명 검증</text>
  <text x="445" y="166" text-anchor="middle" font-size="11" fill="#666">난수 일치 · 측정값 추출</text>
  <text x="805" y="152" text-anchor="middle" font-size="11" fill="#666">값 일치 · 만료 전</text>
  <text x="805" y="166" text-anchor="middle" font-size="11" fill="#666">서명자가 승인자인가</text>

  <!-- verdict -->
  <text x="40" y="196" font-size="12"><tspan font-weight="bold">exit 0</tspan>  TEE와 맞는 등록이 있다</text>
  <text x="40" y="214" font-size="12"><tspan font-weight="bold">exit 1</tspan>  없다, 이유와 함께</text>
</svg>
