<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 560" width="1330" height="560" role="img" aria-labelledby="t d">
  <title id="t">Attestamp 동작 방식: 감사자가 등록하는 경우</title>
  <desc id="d">제공자는 TEE에서 코드를 실행하고 소스와 빌드 정보를 감사자에게 보낸다. 감사자는 같은 소스를 자기 TEE에서 다시 빌드해 같은 해시를 얻고, 서명해서 블록체인에 등록한다. 사용자는 제공자의 TEE에 해시를 요청하고, 블록체인에서 등록된 해시를 조회해 둘이 같을 때만 서비스를 믿는다.</desc>
  <style>
    :root { --ink: #1f2937; --sub: #4b5563; --line: #8a94a6; --accent: #0d9488; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f3f4f6; --sub: #cbd5e1; --line: #94a3b8; --accent: #2dd4bf; }
    }
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; text-anchor: middle; fill: var(--ink); }
    .box    { fill: none; stroke: var(--line); stroke-width: 3; }
    .chain  { fill: none; stroke: var(--accent); stroke-width: 5; }
    .tee    { fill: var(--accent); fill-opacity: 0.10; stroke: var(--accent); stroke-width: 3; }
    .role   { font-size: 40px; font-weight: 800; }
    .sub    { font-size: 22px; fill: var(--sub); }
    .tag    { font-size: 28px; font-weight: 800; fill: var(--accent); }
    .body   { font-size: 24px; font-weight: 600; }
    .lbl    { font-size: 22px; font-weight: 600; fill: var(--sub); }
    .arrow  { fill: none; stroke: var(--line); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .read   { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--line)"/>
    </marker>
    <marker id="headA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="20" width="320" height="270" rx="18"/>
  <text class="role" x="170" y="76">제공자</text>
  <text class="sub" x="170" y="108">서비스 운영</text>
  <rect class="tee" x="35" y="135" width="270" height="130" rx="14"/>
  <text class="tag" x="170" y="180">TEE</text>
  <text class="body" x="170" y="228">코드  →  해시</text>
  <rect class="box" x="505" y="20" width="320" height="270" rx="18"/>
  <text class="role" x="665" y="76">감사자</text>
  <text class="sub" x="665" y="108">소스를 다시 빌드</text>
  <rect class="tee" x="530" y="135" width="270" height="130" rx="14"/>
  <text class="tag" x="665" y="180">TEE</text>
  <text class="body" x="665" y="218">같은 코드</text>
  <text class="body" x="665" y="248">→  같은 해시</text>
  <rect class="chain" x="1000" y="20" width="320" height="270" rx="18"/>
  <text class="role" x="1160" y="76">블록체인</text>
  <text class="sub" x="1160" y="108">이더리움</text>
  <rect class="tee" x="1025" y="135" width="270" height="130" rx="14"/>
  <text class="tag" x="1160" y="180">레지스트리</text>
  <text class="body" x="1160" y="218">감사자가 서명한</text>
  <text class="body" x="1160" y="248">해시</text>
  <path class="arrow" d="M336 200H499" marker-end="url(#head)"/>
  <text class="lbl" x="417" y="150">1. 소스와 빌드</text>
  <text class="lbl" x="417" y="176">정보 전달</text>
  <path class="arrow" d="M831 200H994" marker-end="url(#head)"/>
  <text class="lbl" x="912" y="150">2. 서명해서</text>
  <text class="lbl" x="912" y="176">등록</text>
  <rect class="box" x="505" y="420" width="320" height="130" rx="18"/>
  <text class="role" x="665" y="476">사용자</text>
  <text class="sub" x="665" y="510">TEE 해시 = 등록 해시?</text>
  <path class="read" d="M499 485H170 V298" marker-end="url(#headA)"/>
  <text class="lbl" x="337" y="466">3. TEE에 해시 요청</text>
  <path class="read" d="M831 485H1160 V298" marker-end="url(#headA)"/>
  <text class="lbl" x="992" y="466">4. 등록 해시 조회</text>
</svg>
