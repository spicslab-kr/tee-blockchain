<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d">
  <title id="t">Attestamp</title>
  <desc id="d">A rubber stamp whose handle is two interlocked chain links presses on a processor chip. The chip has pins on all four sides and an isolated region that runs code, marked with a check.</desc>
  <style>
    :root { --ink: #1f2937; --accent: #0d9488; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e5e7eb; --accent: #2dd4bf; }
    }
    .ink    { stroke: var(--ink);    fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--accent); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fill   { fill: var(--accent); stroke: none; }
  </style>

  <!-- chain: two interlocked links form the stamp's handle -->
  <g class="accent" stroke-width="6">
    <rect x="109" y="4" width="22" height="50" rx="11"/>
    <rect x="102" y="40" width="36" height="48" rx="14"/>
  </g>

  <!-- the stamp: a flat base and the rubber pad, in the same colour as the code it marks -->
  <rect class="ink" x="70" y="88" width="100" height="20" rx="7" stroke-width="7"/>
  <rect class="fill" x="78" y="112" width="84" height="9" rx="3"/>

  <!-- TEE: a processor chip with pins on all four sides -->
  <rect class="ink" x="70" y="142" width="100" height="80" rx="12" stroke-width="7"/>
  <g class="ink" stroke-width="7">
    <path d="M96 142V130M120 142V130M144 142V130"/>
    <path d="M96 222V234M120 222V234M144 222V234"/>
    <path d="M70 162H54M70 182H54M70 202H54"/>
    <path d="M170 162H186M170 182H186M170 202H186"/>
  </g>

  <!-- the isolated region inside the chip, running code -->
  <rect class="accent" x="88" y="158" width="64" height="48" rx="8" stroke-width="4.5" stroke-dasharray="8 5"/>
  <g class="accent" stroke-width="5">
    <path d="M106 171L97 182L106 193"/>
    <path d="M134 171L143 182L134 193"/>
    <path d="M125 168L115 196"/>
  </g>

  <!-- the stamp has landed: a check badge on the chip -->
  <circle class="fill" cx="170" cy="142" r="15"/>
  <path d="M163 142l5 5 9-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
